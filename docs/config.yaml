  entries:
  - icon: message-text-outline
    label: Chat Guide
    description: Using the chat interface
    link: '{link-guides}/chat'
  - icon: xml
    label: API Guide
    description: Endpoints, auth, and examples
    link: '{link-guides}/api'
  - icon: toolbox-outline
    label: Tool Guide
    # description: Word and PowerPoint generation examples
    # link: '{link-guides}/tools'
    description: Under development
    disabled: true
  - icon: robot-outline
    label: Agents
    description: Under development
    disabled: true
leaderboard:
  heading: LLM Leaderboard
  fullLeaderboard:
    label: Full Leaderboard
    link: '{link-leaderboard}'
    # Enable/disable links to benchmark details from the leaderboard page.
    detailEnabled: false
  subtitle: Avg Score (%) across 7 benchmarks.
  dataSource:
    adapter: json
    # Written by build_site_data.py; one flat row per model, already ranked.
    url: '{link-leaderboard}/data/overall.json'
    method: GET
    headers: {}
    responsePath: models
    timeoutMs: 60000
    pollIntervalMs: 0
    fallbackToMock: false
  vendors:
    nemotron-3-ultra-550b-a55b: NVIDIA
    nemotron-3-super-120b: NVIDIA
    muse-glimmer-30b: Meta
    llama-4-scout-17b: Meta
    gpt-oss-120b: OpenAI
    gpt-5.4-nano: OpenAI
    gemma-4-26b: Google
    claude-sonnet-4-6: Anthropic
  markers:
  - symbol: "*"
    providers: ["llama-4-scout-17b"]
    note: No longer available on BRAIN.
  - symbol: "#"
    providers: ["claude-sonnet-4-6", "gpt-5.4-nano"]
    note: External model, evaluated for comparison only - not served by BRAIN.
  sorting:
    defaultColumn: overallPct
    defaultDirection: desc
  display:
    # 0 (or omitted) shows every model in the feed rather than a top-N slice.
    maxRows: 0
    modelKey: provider
    modelLinkKey: link
    showDevelopmentNotice: false
    developmentNotice: Showing temporary development data.
    fallbackNotice: Live rankings are temporarily unavailable. Showing development
      data.
    errorMessage: Leaderboard data is temporarily unavailable.
    emptyMessage: No models are available.
  columns:
  - key: rank
    label: Rank
    visible: true
    sortable: false
    width: 50px
  - key: provider
    label: Model
    visible: true
    sortable: true
    width: 215px
  - key: vendor
    label: Provider
    visible: true
    sortable: true
    width: 110px
  - key: overallPct
    label: Avg Score
    displayLabel: Avg Score (%)
    visible: true
    sortable: true
    format: decimal
    decimals: 1
    info: Mean of the model's per-benchmark pass rates across 7 benchmarks. Each
      benchmark counts once, so a 1,000-question benchmark does not outweigh a
      164-question one. Not a pooled accuracy.
  # Still in the feed, hidden to keep the panel to four columns.
  # (The full table is on the leaderboard page.)
  - key: benchmarkCount
    label: Benchmarks
    visible: false
    sortable: true
    format: integer
  - key: passCount
    label: Passed
    visible: false
    sortable: true
    format: integer
  - key: n
    label: Questions
    visible: false
    sortable: true
    format: integer
  # Runs were split between a local machine and an NVIDIA server,
  # so the timings are not comparable between models.
  - key: avgLatencyMs
    label: Avg Latency (ms)
    visible: false
    sortable: true
    format: integer
