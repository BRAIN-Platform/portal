hero:
  headline: Local LLM Inference for Scientific Discovery
  summary: Open-weight models served on Brookhaven Lab hardware for both 
    interactive and programmatic use.
  actions:
  - icon: message-text-outline
    label: Start Chatting
    link: '{link-chat}'
  - icon: xml
    label: API Key Manager
    link: '{link-api-km}'
  actionsNote: Chat in your browser, or connect an existing OpenAI-compatible client 
    to our base URL.
  accessNote: Available only on the BNL network or via VPN. Sign in with your 
    Brookhaven Lab account to get started.
  trustItems:
  - icon: database-lock-outline
    label: Prompts and outputs remain on BNL infrastructure — never sent to 
      external providers.
about:
  heading: About BRAIN
  # {link-chat} and {link-api} are replaced with real links at render time,
  # using the navigation items' full name ("name") and link destination.
  intro: BRookhAven INference (BRAIN) is Brookhaven National Laboratory's
    secure platform for running and integrating generative machine learning
    models on our own infrastructure. BRAIN provides access to open-weight models
    through a {link-chat} and an OpenAI-compatible {link-api}, along with
    published model evaluations and an extensible ecosystem of tools and agents.
    It is designed to accelerate scientific discovery while keeping data within
    the lab network. Common uses include searching and summarizing scientific
    literature, drafting and debugging analysis code, extracting structured data
    from papers and reports, and summarizing long documents.
  # Tokens matching navigation items (e.g. {link-chat}) resolve automatically.
  # For additional inline links that are NOT part of the navigation bar, define
  # them here:
  # links:
  # - token: link-bnl-docs
  #   name: BNL documentation
  #   link: https://intranet.bnl.gov/docs
  models:
    heading: Available models
    items:
    # Grouped by modality, matching the hosted-models table.
    # `detail` is the provider plus context window in brackets.
    - group: Text / code
    # Optional `info` is shown on hover/focus.
    - name: nemotron-3-ultra-550b
      detail: NVIDIA (512K context window)
      info: Highest overall score on our benchmarks, and reasons step by step. 1M-token
        context window, limited to 512K by available computing resources.
    - name: nemotron-3-super-120b
      detail: NVIDIA (up to 1M context window)
      info: Reasons step by step before answering, which helps on multi-step problems.
        Efficient to run for a model of its size.
    - name: gpt-oss-120b
      detail: OpenAI (up to 131K context window)
      info: OpenAI's open-weight model. Reasons before answering, with adjustable effort -
        lower for quick replies, higher for harder problems.
    - group: Text / code / image analysis
    - name: muse-glimmer-30b
      detail: Meta (131K+ context window)
      info: Understands both text and images, and responds with text or code. Reasons
        step by step before answering.
    - name: gemma-4-26b
      detail: Google (up to 256K context window)
      info: Understands both text and images, and responds with text or code. Reasoning
        can be switched on or off, trading depth for speed.
    - group: Specialized
    - name: bnl-nemotron-3
      detail: NVIDIA Nemotron · grounded in SBMS documentation · chat only
      info: Answers questions about Brookhaven Lab policies and procedures using the
        lab's Standards Based Management System (SBMS).
    - group: Image generation
    - name: FLUX.1 [schnell]
      detail: Black Forest Labs (up to 512 input tokens) · chat only
      info: Text-to-image model tuned for fast generation. Describe the image you
        want in the prompt.
    - group: Embedding model
    - name: nomic-embed-text
      detail: Nomic AI
      info: Turns text into vectors so documents can be searched by meaning. Used for
        retrieval and knowledge bases rather than chat.
    # note: Additional details could be referred in this note.
  notices:
    label: Models & open source notices
    link: notices/models-and-open-source
userGuides:
  heading: User Guides
  allGuides:
